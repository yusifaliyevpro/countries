name: PR Checks

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.x

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      # Rotate the test response cache every 6 hours: within a window the suite
      # replays cached API responses (offline, no rate-limit hits); when the
      # window rolls the key misses, so the tests refetch from the live API and
      # repopulate the cache. 21600 seconds = 6 hours.
      - name: Compute cache window
        id: cache-window
        run: echo "bucket=$(( $(date +%s) / 21600 ))" >> "$GITHUB_OUTPUT"

      - name: Cache test API responses
        uses: actions/cache@v6
        with:
          path: tests/.cache/responses
          key: countries-test-responses-v1-${{ steps.cache-window.outputs.bucket }}

      - name: Run checks
        run: pnpm check
        env:
          REST_COUNTRIES_API_KEY: ${{ secrets.REST_COUNTRIES_API_KEY }}
